name: QuartzCore oracle
on: push
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run the QuartzCore probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_probe.m -o qc_probe
          ./qc_probe 2>&1
      - name: Compile and run the CAMediaTimingFunction probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_timing_probe.m -o qc_timing_probe
          ./qc_timing_probe 2>&1
      - name: Compile and run the affine bridge probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_affine_probe.m -o qc_affine_probe
          ./qc_affine_probe 2>&1
      - name: Compile and run the CALayer geometry probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_calayer_geometry_probe.m -o qc_calayer_geometry_probe
          ./qc_calayer_geometry_probe 2>&1
      - name: Compile and run the second CALayer geometry probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_calayer_geometry_probe2.m -o qc_calayer_geometry_probe2
          ./qc_calayer_geometry_probe2 2>&1
      - name: Compile and run the CALayer KVO and tree probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_calayer_kvo_probe.m -o qc_calayer_kvo_probe
          ./qc_calayer_kvo_probe 2>&1
      - name: Compile and run the CATransaction probe
        run: |
          clang -Wno-deprecated-declarations -fobjc-arc \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_transaction_probe.m -o qc_transaction_probe
          ./qc_transaction_probe 2>&1
      - name: Compile and run the string constant probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_constants_probe.m -o qc_constants_probe
          ./qc_constants_probe 2>&1
      - name: Compile and run the CAShapeLayer probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_shapelayer_probe.m -o qc_shapelayer_probe
          ./qc_shapelayer_probe 2>&1
      - name: Compile and run the media timing defaults probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_timing_defaults_probe.m -o qc_timing_defaults_probe
          ./qc_timing_defaults_probe 2>&1
      - name: Compile and run the convertTime probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_converttime_probe.m -o qc_converttime_probe
          ./qc_converttime_probe 2>&1
      - name: Compile and run the animation probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_animation_probe.m -o qc_animation_probe
          ./qc_animation_probe 2>&1
      - name: Compile and run the layer state probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_layer_state_probe.m -o qc_layer_state_probe
          ./qc_layer_state_probe 2>&1
      - name: Compile and run the action lookup probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_action_probe.m -o qc_action_probe
          ./qc_action_probe 2>&1
      - name: Compile and run the CARenderer probe
        timeout-minutes: 3
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             -framework OpenGL             Tests/oracle/qc_renderer_probe.m -o qc_renderer_probe
          ./qc_renderer_probe 2>&1
      - name: Compile and run the second CARenderer probe
        timeout-minutes: 3
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             -framework OpenGL             Tests/oracle/qc_renderer2_probe.m -o qc_renderer2_probe
          ./qc_renderer2_probe 2>&1
      - name: Compile and run the completion block probe
        timeout-minutes: 3
        run: |
          clang -Wno-deprecated-declarations -fobjc-arc \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_completion_probe.m -o qc_completion_probe
          ./qc_completion_probe 2>&1
      - name: Compile and run the second completion block probe
        timeout-minutes: 3
        run: |
          clang -Wno-deprecated-declarations -fobjc-arc             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_completion2_probe.m -o qc_completion2_probe
          ./qc_completion2_probe 2>&1
      - name: Compile and run the thread stack probe
        timeout-minutes: 3
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_threadstack_probe.m -o qc_threadstack_probe
          ./qc_threadstack_probe 2>&1
      - name: Compile and run the flush and lock probe
        timeout-minutes: 3
        run: |
          clang -Wno-deprecated-declarations -fobjc-arc \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_flushlock_probe.m -o qc_flushlock_probe
          ./qc_flushlock_probe 2>&1
      - name: Compile and run the layout flag probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_layoutflag_probe.m -o qc_layoutflag_probe
          ./qc_layoutflag_probe 2>&1
      - name: Compile and run the sublayers probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_sublayers_probe.m -o qc_sublayers_probe
          ./qc_sublayers_probe 2>&1
      - name: Compile and run the hit test probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_hittest_probe.m -o qc_hittest_probe
          ./qc_hittest_probe 2>&1
      - name: Compile and run the display and layout probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework QuartzCore -framework CoreGraphics -framework Foundation \
            Tests/oracle/qc_display_probe.m -o qc_display_probe
          ./qc_display_probe 2>&1
      - name: Compile and run the CG key-value probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_cgkvc_probe.m -o qc_cgkvc_probe
          ./qc_cgkvc_probe 2>&1
      - name: Compile and run the media time clock probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_clock_probe.m -o qc_clock_probe
          ./qc_clock_probe 2>&1
      - name: Compile and run the dynamic property probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_dynprop_probe.m -o qc_dynprop_probe
          ./qc_dynprop_probe 2>&1
      - name: Compile and run the dynamic character property probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_dynchar_probe.m -o qc_dynchar_probe
          ./qc_dynchar_probe 2>&1
      - name: Compile and run the value function probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_valuefn_probe.m -o qc_valuefn_probe
          ./qc_valuefn_probe 2>&1
      - name: Compile and run the timing function solver probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_timingsolve_probe.m -o qc_timingsolve_probe
          ./qc_timingsolve_probe 2>&1
      - name: Compile and run the implicit animation probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_implicit_probe.m -o qc_implicit_probe
          ./qc_implicit_probe 2>&1
      - name: Compile and run the layer subclass probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_layerclasses_probe.m -o qc_layerclasses_probe
          ./qc_layerclasses_probe 2>&1
      - name: Compile and run the second layer subclass probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_layerclasses2_probe.m -o qc_layerclasses2_probe
          ./qc_layerclasses2_probe 2>&1
      - name: Compile and run the scrollToRect probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_scrollrect_probe.m -o qc_scrollrect_probe
          ./qc_scrollrect_probe 2>&1
      - name: Compile and run the text layer probe
        run: |
          clang -Wno-deprecated-declarations -fobjc-arc             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_textlayer_probe.m -o qc_textlayer_probe
          ./qc_textlayer_probe 2>&1
      - name: Compile and run the constraint probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_constraint_probe.m -o qc_constraint_probe
          ./qc_constraint_probe 2>&1
      - name: Compile and run the second constraint probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_constraint2_probe.m -o qc_constraint2_probe
          ./qc_constraint2_probe 2>&1
      - name: Compile and run the third constraint probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_constraint3_probe.m -o qc_constraint3_probe
          ./qc_constraint3_probe 2>&1
      - name: Compile and run the emitter probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_emitter_probe.m -o qc_emitter_probe
          ./qc_emitter_probe 2>&1
      - name: Compile and run the protocols probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_protocols_probe.m -o qc_protocols_probe
          ./qc_protocols_probe 2>&1
      - name: Compile and run the second protocols probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_protocols2_probe.m -o qc_protocols2_probe
          ./qc_protocols2_probe 2>&1
      - name: Compile and run the keyframe probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_keyframe_probe.m -o qc_keyframe_probe
          ./qc_keyframe_probe 2>&1
      - name: Compile and run the redisplay probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_redisplay_probe.m -o qc_redisplay_probe
          ./qc_redisplay_probe 2>&1
      - name: Compile and run the dynamic structure probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_dynstruct_probe.m -o qc_dynstruct_probe
          ./qc_dynstruct_probe 2>&1
      - name: Compile and run the protocol calls probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_protocolcalls_probe.m -o qc_protocolcalls_probe
          ./qc_protocolcalls_probe 2>&1
      - name: Compile and run the second protocol calls probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_protocolcalls2_probe.m -o qc_protocolcalls2_probe
          ./qc_protocolcalls2_probe 2>&1
      - name: Compile and run the third protocol calls probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_protocolcalls3_probe.m -o qc_protocolcalls3_probe
          ./qc_protocolcalls3_probe 2>&1
      - name: Compile and run the transition properties probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_transitionprops_probe.m -o qc_transitionprops_probe
          ./qc_transitionprops_probe 2>&1
      - name: Compile and run the tranche probe
        run: |
          clang -Wno-deprecated-declarations             -framework QuartzCore -framework CoreGraphics -framework Foundation             Tests/oracle/qc_tranche_probe.m -o qc_tranche_probe
          ./qc_tranche_probe 2>&1
